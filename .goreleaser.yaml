version: 2

project_name: tnotes

builds:
  - id: tnotes
    main: ./cmd/tnotes
    binary: tnotes
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tnotes
    ids:
      - tnotes
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: git
